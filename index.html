<style>
/* =====================================================
   LUXURY AI VISION CURSOR
===================================================== */

@media (pointer:fine){

    body{
        cursor:none !important;
    }

    a,
    button,
    .service,
    .project-window{
        cursor:none !important;
    }

    /* MAIN */
    .lux-cursor{
        position:fixed;
        left:0;
        top:0;
        width:72px;
        height:72px;
        z-index:999999;
        pointer-events:none;
        transform:translate(-50%,-50%);
        opacity:0;
        transition:
            width .35s cubic-bezier(.16,1,.3,1),
            height .35s cubic-bezier(.16,1,.3,1),
            opacity .3s ease;
    }

    body.cursor-visible .lux-cursor{
        opacity:1;
    }


    /* OUTER GOLD ORBIT */

    .lux-orbit{
        position:absolute;
        inset:0;
        border:1px solid rgba(191,158,101,.65);
        border-radius:50%;
        animation:
            cursorSpin 7s linear infinite;
    }

    .lux-orbit::before{
        content:"";
        position:absolute;
        width:5px;
        height:5px;
        background:#C9A86A;
        border-radius:50%;
        top:-3px;
        left:50%;
        box-shadow:
            0 0 12px rgba(201,168,106,.8);
    }


    /* SECOND ORBIT */

    .lux-orbit-two{
        position:absolute;
        width:48px;
        height:48px;
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
        border:1px dashed rgba(17,29,48,.32);
        border-radius:50%;
        animation:
            cursorSpinReverse 5s linear infinite;
    }


    /* INNER CROSS */

    .lux-cross{
        position:absolute;
        left:50%;
        top:50%;
        width:38px;
        height:38px;
        transform:translate(-50%,-50%);
    }

    .lux-cross::before,
    .lux-cross::after{
        content:"";
        position:absolute;
        background:#111D30;
        opacity:.55;
    }

    .lux-cross::before{
        width:1px;
        height:100%;
        left:50%;
        top:0;
    }

    .lux-cross::after{
        height:1px;
        width:100%;
        top:50%;
        left:0;
    }


    /* CENTER DIAMOND */

    .lux-core{
        position:absolute;
        left:50%;
        top:50%;
        width:13px;
        height:13px;
        transform:
            translate(-50%,-50%)
            rotate(45deg);

        background:#C9A86A;

        box-shadow:
            0 0 0 4px rgba(201,168,106,.08),
            0 0 22px rgba(201,168,106,.45);

        transition:
            transform .4s cubic-bezier(.16,1,.3,1),
            background .3s ease,
            box-shadow .3s ease;
    }


    /* LITTLE ₹ */

    .lux-symbol{
        position:absolute;
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
        color:#111D30;
        font-family:Georgia,serif;
        font-size:7px;
        opacity:0;
        transition:.25s ease;
    }


    /* HOVER */

    .lux-cursor.hover{
        width:105px;
        height:105px;
    }

    .lux-cursor.hover .lux-orbit{
        border-color:rgba(201,168,106,.9);
        animation-duration:3s;
    }

    .lux-cursor.hover .lux-orbit-two{
        width:68px;
        height:68px;
        border-color:rgba(201,168,106,.5);
    }

    .lux-cursor.hover .lux-core{
        width:20px;
        height:20px;
        transform:
            translate(-50%,-50%)
            rotate(225deg)
            scale(1.05);

        background:#111D30;

        box-shadow:
            0 0 0 5px rgba(17,29,48,.08),
            0 0 30px rgba(17,29,48,.25);
    }

    .lux-cursor.hover .lux-symbol{
        opacity:1;
        color:#C9A86A;
    }


    /* CLICK */

    .lux-cursor.click .lux-core{
        transform:
            translate(-50%,-50%)
            rotate(45deg)
            scale(.65);
    }

    .lux-cursor.click .lux-orbit{
        transform:scale(1.25);
        opacity:0;
        transition:.45s ease;
    }


    /* LABEL */

    .lux-label{
        position:absolute;
        left:50%;
        top:calc(100% + 9px);
        transform:translateX(-50%);
        white-space:nowrap;

        font-family:"DM Mono",monospace;
        font-size:6px;
        letter-spacing:.16em;

        color:#111D30;
        opacity:0;

        transition:.25s ease;
    }

    .lux-cursor.hover .lux-label{
        opacity:1;
    }


    @keyframes cursorSpin{
        to{
            transform:rotate(360deg);
        }
    }

    @keyframes cursorSpinReverse{
        to{
            transform:
                translate(-50%,-50%)
                rotate(-360deg);
        }
    }

}


/* =====================================================
   MOBILE — NO CUSTOM CURSOR
===================================================== */

@media (pointer:coarse){

    .lux-cursor{
        display:none !important;
    }

}
</style>


<!-- =====================================================
     CURSOR
===================================================== -->

<div class="lux-cursor">

    <div class="lux-orbit"></div>

    <div class="lux-orbit-two"></div>

    <div class="lux-cross"></div>

    <div class="lux-core"></div>

    <div class="lux-symbol">₹</div>

    <div class="lux-label">
        AI VISION
    </div>

</div>


<script>
/* =====================================================
   AI VISION LUXURY CURSOR ENGINE
===================================================== */

const luxCursor =
    document.querySelector(".lux-cursor");

let lx = window.innerWidth / 2;
let ly = window.innerHeight / 2;

let tx = lx;
let ty = ly;


/* FOLLOW */

window.addEventListener("mousemove", e => {

    tx = e.clientX;
    ty = e.clientY;

    document.body.classList.add("cursor-visible");

});


/* SMOOTH MOTION */

function animateCursor(){

    lx += (tx - lx) * 0.16;
    ly += (ty - ly) * 0.16;

    luxCursor.style.left = lx + "px";
    luxCursor.style.top = ly + "px";

    requestAnimationFrame(animateCursor);

}

animateCursor();


/* =====================================================
   MAGNETIC HOVER
===================================================== */

const interactiveElements =
    document.querySelectorAll(
        "a,button,.service,.project-window,.contact-link"
    );


interactiveElements.forEach(el => {

    el.addEventListener("mouseenter", () => {

        luxCursor.classList.add("hover");

    });


    el.addEventListener("mouseleave", () => {

        luxCursor.classList.remove("hover");

    });

});


/* =====================================================
   CLICK ANIMATION
===================================================== */

window.addEventListener("mousedown", () => {

    luxCursor.classList.add("click");

});


window.addEventListener("mouseup", () => {

    setTimeout(() => {

        luxCursor.classList.remove("click");

    },120);

});


/* =====================================================
   MAGNETIC CONTACT LINKS
===================================================== */

document
.querySelectorAll(".contact-link")
.forEach(link => {

    link.addEventListener("mousemove", e => {

        if(window.innerWidth < 800) return;

        const rect =
            link.getBoundingClientRect();

        const x =
            e.clientX -
            rect.left -
            rect.width / 2;

        const y =
            e.clientY -
            rect.top -
            rect.height / 2;

        link.style.transform =
            `translate(${x * .08}px,${y * .08}px)`;

    });


    link.addEventListener("mouseleave", () => {

        link.style.transform =
            "translate(0,0)";

    });

});
</script>
